services:
  photoshoot:
    build:
      context: .
      dockerfile: PhotoShoot/Dockerfile
    ports:
      - "8090:8080"
    volumes:
      # Bind-mount the FTP drop folder (read-only — the app only reads from here)
      # Update this path to match where your FTP server places files on the host.
      - /home/ftpuser:/data/images:ro
      # Named volumes for generated assets
      - photoshoot-thumbnails:/data/thumbnails
      - photoshoot-histograms:/data/histograms
      # Persist ASP.NET Core Data Protection keys for antiforgery/auth cookies
      - photoshoot-data-protection-keys:/data/data-protection-keys
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PHOTOSHOOT_DATA_PROTECTION_KEYS=/data/data-protection-keys
      # Override folder paths or poll interval here if needed, e.g.:
      # - ImageMonitor__PollIntervalSeconds=10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s

volumes:
  photoshoot-thumbnails:
  photoshoot-histograms:
  photoshoot-data-protection-keys:
